<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wolverines Lineup Manager</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wolverines">
<meta name="theme-color" content="#2b4f8c">

<!-- Firebase (optional). If firebaseConfig below is left blank, the app runs fine on a single device using local storage only. Fill in firebaseConfig near the top of the <script> at the bottom of this file to sync live across every coach's phone. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  :root {
    --bg-page: #F5F3EF;
    --surface: #FFFFFF;
    --surface-alt: #EFEDE7;
    --border: #E4E1D8;
    --border-strong: #D6D2C6;
    --text-primary: #2B2A26;
    --text-secondary: #83806F;
    --text-muted: #ACA894;
    --accent: #C2660B;
    --accent-bg: #FBE7D0;
    --accent-text: #8A4A0C;
    --slate: #3F4656;
    --slate-bg: #E7E9EE;
    --slate-text: #3F4656;
    --danger: #B4451F;
    --danger-bg: #FBE9E2;
    --good: #3F6B3F;
    --good-bg: #E6EEE3;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(43,42,38,0.06), 0 1px 8px rgba(43,42,38,0.04);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Arial, sans-serif;
    background: var(--bg-page);
    color: var(--text-primary);
    padding: 20px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 980px; margin: 0 auto; }

  .header { margin-bottom: 14px; }
  .header h1 {
    margin: 0 0 4px;
    font-size: 22px;
    font-weight: 650;
    color: var(--text-primary);
    letter-spacing: -0.01em;
  }
  .header p { margin: 0; color: var(--text-secondary); font-size: 13.5px; }

  .sync-banner {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    padding: 5px 11px;
    border-radius: 999px;
    margin-bottom: 18px;
  }
  .sync-banner.on { background: var(--good-bg); color: var(--good); }
  .sync-banner.off { background: var(--surface-alt); color: var(--text-secondary); }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px;
    margin-bottom: 16px;
  }
  .section-label {
    font-size: 12px;
    font-weight: 650;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-secondary);
    margin: 0 0 10px;
  }
  .section-sub { font-size: 12.5px; color: var(--text-secondary); margin: -6px 0 12px; }

  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 6px 13px;
    border-radius: 999px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text-primary);
    font-weight: 550;
    font-size: 13px;
    cursor: pointer;
  }
  .chip.inactive {
    background: var(--surface-alt);
    border-color: var(--border);
    color: var(--text-muted);
    text-decoration: line-through;
  }

  .template-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .custom-tag {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--accent-text);
    background: var(--accent-bg);
    padding: 2px 6px;
    border-radius: 999px;
    margin-left: 4px;
  }
  .btn {
    border: 1px solid var(--border-strong);
    border-radius: 9px;
    padding: 9px 15px;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    background: var(--surface);
    color: var(--text-primary);
  }
  .btn:hover { background: var(--surface-alt); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #FFF8F0; }
  .btn-primary:hover { background: #A8560A; }
  .btn-ghost { background: transparent; border-color: var(--border); color: var(--text-secondary); }
  .btn-ghost:hover { background: var(--surface-alt); }
  .btn-danger { background: transparent; border-color: var(--danger); color: var(--danger); }
  .btn-danger:hover { background: var(--danger-bg); }
  .btn-sm { padding: 6px 11px; font-size: 12.5px; }

  .boards { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 720px) { .boards { grid-template-columns: 1fr 1fr; } }

  .board-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border-radius: 10px 10px 0 0;
  }
  .board-header.offense { background: var(--accent-bg); }
  .board-header.defense { background: var(--slate-bg); }
  .board-title { font-weight: 650; font-size: 13.5px; letter-spacing: 0.01em; }
  .board-header.offense .board-title { color: var(--accent-text); }
  .board-header.defense .board-title { color: var(--slate-text); }
  .board-count { font-size: 12px; font-weight: 600; }
  .board-header.offense .board-count { color: var(--accent-text); }
  .board-header.defense .board-count { color: var(--slate-text); }

  .slot-list {
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 10px 10px;
    overflow: hidden;
  }
  .slot-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
  }
  .slot-row:last-child { border-bottom: none; }
  .slot-row:nth-child(even) { background: #FAF9F6; }

  .pos-circle {
    width: 38px;
    height: 38px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 1.5px solid var(--border-strong);
    background: var(--surface);
    color: var(--text-secondary);
    font-weight: 700;
    font-size: 10.5px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .pos-circle.filled { border-color: var(--slate); color: var(--slate); background: var(--slate-bg); }
  .pos-circle.empty { border-style: dashed; color: var(--text-muted); }
  .pos-circle.selected {
    background: var(--accent);
    border-color: var(--accent);
    color: #FFF8F0;
    box-shadow: 0 0 0 3px var(--accent-bg);
  }
  .slot-name { font-weight: 600; font-size: 13.5px; color: var(--text-primary); }
  .slot-name.empty { color: var(--text-muted); font-style: italic; font-weight: 500; }

  .bench-label {
    font-size: 11px;
    font-weight: 650;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    margin: 10px 0 5px;
  }
  .bench-box {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    min-height: 38px;
    padding: 8px;
    border: 1px dashed var(--border-strong);
    border-radius: 9px;
    background: var(--surface-alt);
  }
  .bench-chip {
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text-primary);
    font-weight: 550;
    font-size: 13px;
    cursor: pointer;
  }
  .bench-chip.selected { background: var(--accent); border-color: var(--accent); color: #FFF8F0; }
  .bench-empty { font-size: 12px; color: var(--text-muted); font-style: italic; padding: 6px; }

  .commit-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }

  .shift-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  @media (min-width: 640px) { .shift-grid { grid-template-columns: repeat(4, 1fr); } }
  .shift-card {
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 9px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--surface);
  }
  .shift-card.inactive { border-color: var(--border); color: var(--text-muted); background: var(--surface-alt); }
  .shift-name { font-weight: 600; font-size: 13px; }
  .shift-count { font-weight: 700; font-size: 17px; color: var(--text-primary); }
  .shift-card.inactive .shift-count { color: var(--text-muted); }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ================= Firebase (optional multi-coach sync) =================
   Leave every value below as "" to run in single-device mode (saved to
   this phone only, via localStorage). To sync live across every coach's
   phone, create a free project at console.firebase.google.com, enable
   Firestore, and paste your web app config values in below. */
const firebaseConfig = {
  apiKey: "AIzaSyBDW9A7RBiy7IeWe37JsZ_8af8qjgCOJJ0",
  authDomain: "wolverines-lineup.firebaseapp.com",
  projectId: "wolverines-lineup",
  storageBucket: "wolverines-lineup.firebasestorage.app",
  messagingSenderId: "450191188752",
  appId: "1:450191188752:web:c633f241fe095453213b95"
};
/* =========================================================================== */

const firebaseConfigured = !!(firebaseConfig.apiKey && firebaseConfig.projectId);
let db = null;
let firebaseConnected = false;
if (firebaseConfigured && window.firebase) {
  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  } catch (e) {
    db = null;
  }
}

const STORAGE_KEY = "wolverines_state_v1";
const OFFENSE_POS = ["QB","WR","WR","C","LG","RG","SL","RB","RB"];
const DEFENSE_POS = ["DT","DT","DT","LB","LB","LB","DB","DB","DB"];

const ROSTER_INIT = ["Blake","Carter","Gus","Wyatt","Elliott M.","Asher","Ethan","Griffin","Luca","Elliot R.","Preston","Mason","Gage"];

const OFFENSE_A = ["Blake","Elliott M.","Asher","Ethan","Griffin","Luca","Gage","Gus","Wyatt"];
const OFFENSE_B = ["Carter","Asher","Elliott M.","Wyatt","Griffin","Elliot R.","Ethan","Preston","Mason"];
const DEFENSE_A = ["Luca","Gage","Wyatt","Gus","Ethan","Griffin","Asher","Elliott M.","Blake"];
const DEFENSE_B = ["Ethan","Wyatt","Elliot R.","Elliott M.","Griffin","Mason","Carter","Asher","Preston"];

function makeSlots(posArr, nameArr, activeSet) {
  return posArr.map(function(pos, i){
    const nm = nameArr[i];
    return { pos: pos, name: activeSet.has(nm) ? nm : "" };
  });
}

let state = {
  roster: ROSTER_INIT.map(function(name){ return { name: name, active: true }; }),
  offenseSlots: OFFENSE_POS.map(function(pos,i){ return { pos: pos, name: OFFENSE_A[i] }; }),
  defenseSlots: DEFENSE_POS.map(function(pos,i){ return { pos: pos, name: DEFENSE_B[i] }; }),
  selOffense: null,
  selDefense: null,
  shiftCounts: {},
  drivesOffense: 0,
  drivesDefense: 0,
  history: [],
  templateHalf1: null,
  templateHalf2: null
};
ROSTER_INIT.forEach(function(n){ state.shiftCounts[n] = 0; });

/* ---------- persistence: localStorage always, Firestore if configured ---------- */

function syncPayload() {
  return {
    roster: state.roster,
    offenseSlots: state.offenseSlots,
    defenseSlots: state.defenseSlots,
    shiftCounts: state.shiftCounts,
    drivesOffense: state.drivesOffense,
    drivesDefense: state.drivesDefense,
    history: state.history,
    templateHalf1: state.templateHalf1,
    templateHalf2: state.templateHalf2
  };
}

function applyPayload(data) {
  if (!data) return;
  if (data.roster) state.roster = data.roster;
  if (data.offenseSlots) state.offenseSlots = data.offenseSlots;
  if (data.defenseSlots) state.defenseSlots = data.defenseSlots;
  if (data.shiftCounts) state.shiftCounts = data.shiftCounts;
  if (typeof data.drivesOffense === "number") state.drivesOffense = data.drivesOffense;
  if (typeof data.drivesDefense === "number") state.drivesDefense = data.drivesDefense;
  if (data.history) state.history = data.history;
  state.templateHalf1 = data.templateHalf1 || null;
  state.templateHalf2 = data.templateHalf2 || null;
}

function persist() {
  const payload = syncPayload();
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(payload)); } catch (e) {}
  if (db) {
    db.collection("wolverines").doc("gameState").set(payload).catch(function(e){
      console.error("Firestore write failed", e);
    });
  }
}

function loadFromLocalStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    applyPayload(JSON.parse(raw));
    return true;
  } catch (e) {
    return false;
  }
}

loadFromLocalStorage();

if (db) {
  db.collection("wolverines").doc("gameState").onSnapshot(function(doc){
    firebaseConnected = true;
    if (doc.exists) {
      applyPayload(doc.data());
    } else {
      persist();
    }
    render();
  }, function(err){
    console.error("Firestore sync error", err);
    firebaseConnected = false;
    render();
  });
}

/* ---------- helpers ---------- */

function activeSet() {
  const s = new Set();
  state.roster.forEach(function(k){ if (k.active) s.add(k.name); });
  return s;
}
function activeNames() {
  return state.roster.filter(function(k){ return k.active; }).map(function(k){ return k.name; });
}

function saveCurrentAsTemplate(which) {
  const data = {
    offense: state.offenseSlots.map(function(s){ return s.name; }),
    defense: state.defenseSlots.map(function(s){ return s.name; })
  };
  if (which === "half1") state.templateHalf1 = data; else state.templateHalf2 = data;
  persist();
  render();
}

function resetTemplate(which) {
  if (which === "half1") state.templateHalf1 = null; else state.templateHalf2 = null;
  persist();
  render();
}

function loadTemplate(which) {
  const as = activeSet();
  const stored = which === "half1" ? state.templateHalf1 : state.templateHalf2;
  if (stored) {
    state.offenseSlots = makeSlots(OFFENSE_POS, stored.offense, as);
    state.defenseSlots = makeSlots(DEFENSE_POS, stored.defense, as);
  } else if (which === "half1") {
    state.offenseSlots = makeSlots(OFFENSE_POS, OFFENSE_A, as);
    state.defenseSlots = makeSlots(DEFENSE_POS, DEFENSE_B, as);
  } else {
    state.offenseSlots = makeSlots(OFFENSE_POS, OFFENSE_B, as);
    state.defenseSlots = makeSlots(DEFENSE_POS, DEFENSE_A, as);
  }
  state.selOffense = null;
  state.selDefense = null;
  persist();
  render();
}

function toggleActive(name) {
  state.roster = state.roster.map(function(k){ return k.name === name ? { name: k.name, active: !k.active } : k; });
  if (!state.roster.find(function(k){ return k.name === name; }).active) {
    state.offenseSlots = state.offenseSlots.map(function(s){ return s.name === name ? { pos: s.pos, name: "" } : s; });
    state.defenseSlots = state.defenseSlots.map(function(s){ return s.name === name ? { pos: s.pos, name: "" } : s; });
  }
  state.selOffense = null;
  state.selDefense = null;
  persist();
  render();
}

function getSlots(side) { return side === "offense" ? state.offenseSlots : state.defenseSlots; }
function setSlots(side, arr) { if (side === "offense") state.offenseSlots = arr; else state.defenseSlots = arr; }

function handleSlotTap(side, index) {
  const selKey = side === "offense" ? "selOffense" : "selDefense";
  const sel = state[selKey];
  const slots = getSlots(side);

  if (!sel) {
    if (slots[index].name) state[selKey] = { kind: "slot", index: index };
    render();
    return;
  }
  if (sel.kind === "slot" && sel.index === index) { state[selKey] = null; render(); return; }
  if (sel.kind === "slot") {
    const arr = slots.map(function(s){ return Object.assign({}, s); });
    const tmp = arr[sel.index].name;
    arr[sel.index].name = arr[index].name;
    arr[index].name = tmp;
    setSlots(side, arr);
    state[selKey] = null;
    persist();
    render();
    return;
  }
  if (sel.kind === "bench") {
    const arr = slots.map(function(s){ return Object.assign({}, s); });
    arr[index].name = sel.name;
    setSlots(side, arr);
    state[selKey] = null;
    persist();
    render();
  }
}

function handleBenchTap(side, name) {
  const selKey = side === "offense" ? "selOffense" : "selDefense";
  const sel = state[selKey];
  if (!sel) { state[selKey] = { kind: "bench", name: name }; render(); return; }
  if (sel.kind === "bench" && sel.name === name) { state[selKey] = null; render(); return; }
  if (sel.kind === "bench") { state[selKey] = { kind: "bench", name: name }; render(); return; }
  if (sel.kind === "slot") {
    const arr = getSlots(side).map(function(s){ return Object.assign({}, s); });
    arr[sel.index].name = name;
    setSlots(side, arr);
    state[selKey] = null;
    persist();
    render();
  }
}

function benchSelected(side) {
  const selKey = side === "offense" ? "selOffense" : "selDefense";
  const sel = state[selKey];
  if (!sel || sel.kind !== "slot") return;
  const arr = getSlots(side).map(function(s){ return Object.assign({}, s); });
  arr[sel.index].name = "";
  setSlots(side, arr);
  state[selKey] = null;
  persist();
  render();
}

function commitDrive(side) {
  const slots = getSlots(side);
  const snapshot = {
    side: side,
    names: slots.filter(function(s){ return s.name; }).map(function(s){ return s.name; })
  };
  snapshot.names.forEach(function(n){
    if (state.shiftCounts[n] === undefined) state.shiftCounts[n] = 0;
    state.shiftCounts[n] += 1;
  });
  if (side === "offense") state.drivesOffense += 1; else state.drivesDefense += 1;
  state.history.push(snapshot);
  persist();
  render();
}

function undoLast(side) {
  for (let i = state.history.length - 1; i >= 0; i--) {
    if (state.history[i].side === side) {
      const snap = state.history[i];
      snap.names.forEach(function(n){ state.shiftCounts[n] -= 1; });
      if (side === "offense") state.drivesOffense -= 1; else state.drivesDefense -= 1;
      state.history.splice(i, 1);
      persist();
      render();
      return;
    }
  }
}

function resetGame() {
  const ok = window.confirm("Start a new game? This clears shift totals, drive counts, and undo history for everyone. Rosters and saved rotations stay.");
  if (!ok) return;
  state.shiftCounts = {};
  state.roster.forEach(function(k){ state.shiftCounts[k.name] = 0; });
  state.drivesOffense = 0;
  state.drivesDefense = 0;
  state.history = [];
  persist();
  render();
}

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function renderBoard(side, title, driveCount) {
  const slots = getSlots(side);
  const names = activeNames();
  const placed = {};
  slots.forEach(function(s){ if (s.name) placed[s.name] = true; });
  const bench = names.filter(function(n){ return !placed[n]; });
  const sel = side === "offense" ? state.selOffense : state.selDefense;

  let html = '<div class="board-header ' + side + '">' +
    '<span class="board-title">' + title + '</span>' +
    '<span class="board-count">' + driveCount + ' drive' + (driveCount === 1 ? '' : 's') + ' committed</span>' +
    '</div><div class="slot-list">';
  slots.forEach(function(slot, i){
    const isSel = sel && sel.kind === "slot" && sel.index === i;
    let circleClass = "pos-circle";
    if (isSel) circleClass += " selected";
    else if (slot.name) circleClass += " filled";
    else circleClass += " empty";
    html += '<div class="slot-row">' +
      '<div class="' + circleClass + '" data-action="tap-slot" data-side="' + side + '" data-index="' + i + '">' + slot.pos + '</div>' +
      '<div class="slot-name' + (slot.name ? '' : ' empty') + '">' + (slot.name ? esc(slot.name) : 'open slot') + '</div>' +
      '</div>';
  });
  html += '</div>';
  html += '<div class="bench-label">Bench</div><div class="bench-box">';
  if (bench.length === 0) {
    html += '<div class="bench-empty">everyone&rsquo;s placed</div>';
  } else {
    bench.forEach(function(name){
      const isSel = sel && sel.kind === "bench" && sel.name === name;
      html += '<div class="bench-chip' + (isSel ? ' selected' : '') + '" data-action="tap-bench" data-side="' + side + '" data-name="' + esc(name) + '">' + esc(name) + '</div>';
    });
  }
  html += '</div>';
  html += '<div class="commit-row">' +
    '<div class="btn btn-primary btn-sm" data-action="commit" data-side="' + side + '">Commit this drive</div>';
  if (sel && sel.kind === "slot") {
    html += '<div class="btn btn-ghost btn-sm" data-action="bench-selected" data-side="' + side + '">Bench selected</div>';
  }
  if (driveCount > 0) {
    html += '<div class="btn btn-ghost btn-sm" data-action="undo" data-side="' + side + '">Undo last commit</div>';
  } else {
    html += '<div class="btn btn-ghost btn-sm" style="opacity:0.4;cursor:default;" title="Nothing committed yet on this side">Undo last commit</div>';
  }
  html += '</div>';
  return html;
}

function render() {
  const app = document.getElementById("app");
  const sortedShifts = Object.keys(state.shiftCounts).sort(function(a,b){ return state.shiftCounts[b] - state.shiftCounts[a]; });

  let html = '';
  html += '<div class="header"><h1>Wolverines lineup manager</h1><p>Load a starting rotation, tap to adjust, commit each drive as it happens. Shift totals only change when you commit, so \u201cundo last commit\u201d reverses a commit, not a swap.</p></div>';

  if (firebaseConfigured) {
    html += '<div class="sync-banner ' + (firebaseConnected ? 'on' : 'off') + '">' + (firebaseConnected ? '\u25CF Synced live across coaches' : '\u25CB Connecting\u2026') + '</div>';
  } else {
    html += '<div class="sync-banner off">\u25CB Saved on this device only \u2014 see Gameday Planning below to enable multi-coach sync</div>';
  }

  html += '<div class="panel"><div class="section-label">Roster \u2014 tap to mark absent</div><div class="chip-row">';
  state.roster.forEach(function(k){
    html += '<div class="chip' + (k.active ? '' : ' inactive') + '" data-action="toggle-roster" data-name="' + esc(k.name) + '">' + esc(k.name) + '</div>';
  });
  html += '</div></div>';

  html += '<div class="panel"><div class="section-label">Rotation templates</div>';
  html += '<div class="template-row">' +
    '<div class="btn" data-action="load-template" data-which="half1">Load rotation A (off) / B (def)' + (state.templateHalf1 ? ' <span class="custom-tag">custom</span>' : '') + '</div>' +
    '<div class="btn" data-action="load-template" data-which="half2">Load rotation B (off) / A (def)' + (state.templateHalf2 ? ' <span class="custom-tag">custom</span>' : '') + '</div>' +
    '</div>';
  html += '</div>';

  html += '<div class="panel"><div class="boards">';
  html += '<div>' + renderBoard("offense", "Offense", state.drivesOffense) + '</div>';
  html += '<div>' + renderBoard("defense", "Defense", state.drivesDefense) + '</div>';
  html += '</div></div>';

  html += '<div class="panel"><div class="section-label">Shift totals (committed drives only)</div><div class="shift-grid">';
  sortedShifts.forEach(function(name){
    const k = state.roster.find(function(r){ return r.name === name; });
    const inactive = !(k && k.active);
    html += '<div class="shift-card' + (inactive ? ' inactive' : '') + '"><span class="shift-name">' + esc(name) + '</span><span class="shift-count">' + state.shiftCounts[name] + '</span></div>';
  });
  html += '</div></div>';

  html += '<div class="panel"><div class="section-label">Gameday planning</div>';
  html += '<div class="section-sub">Set up next game\u2019s starting lineups here ahead of time, so during the game everyone just taps Load and goes.</div>';
  html += '<div class="template-row">' +
    '<div class="btn btn-ghost btn-sm" data-action="save-template" data-which="half1">Save current board as rotation A/B (half 1)</div>' +
    '<div class="btn btn-ghost btn-sm" data-action="save-template" data-which="half2">Save current board as rotation B/A (half 2)</div>' +
    '</div>';
  html += '<div class="template-row"><div class="btn btn-danger btn-sm" data-action="reset-game">Start a new game (reset shift totals)</div></div>';
  if (!firebaseConfigured) {
    html += '<div class="section-sub" style="margin-top:10px;">To share this live across all 4 coaches\u2019 phones instead of just this device, this app supports Firebase sync. Ask Coach Steve for the synced version of this file, or see the comment at the top of the page source for setup steps.</div>';
  }
  html += '</div>';

  app.innerHTML = html;
}

document.getElementById("app").addEventListener("click", function(e){
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
  if (action === "toggle-roster") toggleActive(el.dataset.name);
  else if (action === "load-template") loadTemplate(el.dataset.which);
  else if (action === "save-template") saveCurrentAsTemplate(el.dataset.which);
  else if (action === "reset-template") resetTemplate(el.dataset.which);
  else if (action === "tap-slot") handleSlotTap(el.dataset.side, parseInt(el.dataset.index, 10));
  else if (action === "tap-bench") handleBenchTap(el.dataset.side, el.dataset.name);
  else if (action === "bench-selected") benchSelected(el.dataset.side);
  else if (action === "commit") commitDrive(el.dataset.side);
  else if (action === "undo") undoLast(el.dataset.side);
  else if (action === "reset-game") resetGame();
});

render();
</script>
</body>
</html>
